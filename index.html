<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RewardsHub Pro | Elite Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; }
        .hero-gradient { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); }
    </style>
</head>
<body>

<header class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200">
    <nav class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
        <h1 class="text-2xl font-extrabold text-indigo-700 tracking-tight">RewardsHub Pro</h1>
        <div class="space-x-8 text-sm font-semibold text-slate-600">
            <a href="#home" class="hover:text-indigo-600">Home</a>
            <a href="#offers" class="hover:text-indigo-600">Offers</a>
            <a href="#about" class="hover:text-indigo-600">About</a>
        </div>
    </nav>
</header>

<section id="home" class="hero-gradient text-white py-20 px-6 rounded-b-[3rem] text-center">
    <h2 class="text-5xl font-extrabold mb-6">Unlock Premium Rewards & Opportunities</h2>
    <p class="text-indigo-100 text-lg max-w-xl mx-auto mb-10">Explore curated gift cards, cashback offers, and opportunities from top brands worldwide.</p>
    <a href="#offers" class="bg-white text-indigo-700 px-10 py-4 rounded-full font-bold shadow-xl hover:bg-slate-100 transition">Browse Offers</a>
</section>

<section class="max-w-6xl mx-auto px-6 -mt-10">
    <div class="bg-white p-6 rounded-3xl shadow-xl shadow-indigo-100 flex flex-col md:flex-row gap-4">
        <input id="searchInput" type="text" placeholder="Search rewards by name or ID..." class="flex-1 px-6 py-4 rounded-2xl bg-slate-50 border border-slate-200 outline-none focus:ring-2 focus:ring-indigo-500">
        <select id="filter" class="px-6 py-4 rounded-2xl bg-slate-50 border border-slate-200 outline-none cursor-pointer">
            <option value="all">All Categories</option>
            <option value="Amazon">Amazon</option>
            <option value="Walmart">Walmart</option>
            <option value="Cash">Cash App / Zelle</option>
            <option value="Other">Other Rewards</option>
        </select>
    </div>
</section>

<main id="offers" class="max-w-6xl mx-auto px-6 py-16">
    <div id="offerContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8"></div>
</main>

<footer class="py-12 text-center border-t border-slate-200 bg-white">
    <p class="text-slate-500 font-semibold mb-2">© 2026 RewardsHub Pro. All rights reserved.</p>
    <div class="flex justify-center gap-6 text-sm text-slate-400">
        <a href="#home" class="hover:text-indigo-600">Home</a> 
        <a href="#offers" class="hover:text-indigo-600">Offers</a> 
        <a href="#about" class="hover:text-indigo-600">About</a>
    </div>
</footer>

<script>
    // 100% updated list with your requested 15 offers and links
    const offers = [
        {id: 4385, name: "Rewards US - Cash $750 - (US)", type: "Cash", link: "https://www.af9m8trk.com/BL6116FS/W8F12MFY/"},
        {id: 18603, name: "Rewards US - Amazon $750", type: "Amazon", link: "https://www.af9m8trk.com/BL6116FS/54612BXY/"},
        {id: 18651, name: "Rewards UK - Shein £750 Shopping", type: "Other", link: "https://www.af9m8trk.com/BL6116FS/16F12BVJ/"},
        {id: 18652, name: "iPhone 15 Pro Max Bonus $750", type: "Other", link: "https://www.af9m8trk.com/BL6116FS/JFD12BVR/"},
        {id: 18653, name: "Amazon Bonus $750", type: "Amazon", link: "https://www.af9m8trk.com/BL6116FS/MGH12BVQ/"},
        {id: 24913, name: "OkWow - CashApp $850", type: "Cash", link: "https://www.af9m8trk.com/BL6116FS/5JY122KX/"},
        {id: 24918, name: "OkWow - Food $200", type: "Other", link: "https://www.af9m8trk.com/BL6116FS/SUM122L1/"},
        {id: 24951, name: "OkWow - Netflix $100", type: "Other", link: "https://www.af9m8trk.com/BL6116FS/KDQ122LY/"},
        {id: 25582, name: "OkWow - Walmart $1,000", type: "Walmart", link: "https://www.af9m8trk.com/BL6116FS/T6M12294/"},
        {id: 25741, name: "American Prizes Amazon $1,000", type: "Amazon", link: "https://www.af9m8trk.com/BL6116FS/TJ2123FW/"},
        {id: 27279, name: "UpLevelRewards - Zelle $750", type: "Cash", link: "https://www.af9m8trk.com/BL6116FS/8LP123XC/"},
        {id: 27280, name: "UpLevelRewards - $1000 Cash Deposit", type: "Cash", link: "https://www.af9m8trk.com/BL6116FS/4K1123XK/"},
        {id: 27281, name: "UpLevelRewards - Target $750", type: "Other", link: "https://www.af9m8trk.com/BL6116FS/HMG123XJ/"},
        {id: 27282, name: "UpLevelRewards - McDonald's $100", type: "Other", link: "https://www.af9m8trk.com/BL6116FS/UPW123XH/"},
        {id: 27283, name: "UpLevelRewards - Costco $750", type: "Other", link: "https://www.af9m8trk.com/BL6116FS/NB9123XG/"}
    ];

    // High speed optimized brand layout imagery map
    const imageMap = {
        amazon: "https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?w=400&q=75&auto=format&fit=crop", 
        walmart: "https://images.unsplash.com/photo-1601599561264-731ede97f1c9?w=400&q=75&auto=format&fit=crop", 
        cash: "https://images.unsplash.com/photo-1559526324-4b87b5e36e44?w=400&q=75&auto=format&fit=crop", 
        cashapp: "https://images.unsplash.com/photo-1563013544-824ae1d704d3?w=400&q=75&auto=format&fit=crop", 
        zelle: "https://images.unsplash.com/photo-1579621970563-ebec7560ff3e?w=400&q=75&auto=format&fit=crop", 
        iphone: "https://images.unsplash.com/photo-1695048133142-1a20484d2569?w=400&q=75&auto=format&fit=crop", 
        shein: "https://images.unsplash.com/photo-1483985988355-763728e1935b?w=400&q=75&auto=format&fit=crop", 
        netflix: "https://images.unsplash.com/photo-1574375927938-d5a98e8edd86?w=400&q=75&auto=format&fit=crop", 
        mcdonald: "https://images.unsplash.com/photo-1569254994521-dd45f6a6a1aa?w=400&q=75&auto=format&fit=crop", 
        food: "https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=400&q=75&auto=format&fit=crop", 
        target: "https://images.unsplash.com/photo-1534452203293-494d7ddbf7e0?w=400&q=75&auto=format&fit=crop", 
        costco: "https://images.unsplash.com/photo-1578916171728-46686eac8d58?w=400&q=75&auto=format&fit=crop", 
        default: "https://images.unsplash.com/photo-1513151233558-d860c5398176?w=400&q=75&auto=format&fit=crop" 
    };

    function getRelevantImage(name) {
        const lowerName = name.toLowerCase();
        if (lowerName.includes("amazon")) return imageMap.amazon;
        if (lowerName.includes("walmart")) return imageMap.walmart;
        if (lowerName.includes("cashapp") || lowerName.includes("cash app")) return imageMap.cashapp;
        if (lowerName.includes("zelle")) return imageMap.zelle;
        if (lowerName.includes("cash")) return imageMap.cash;
        if (lowerName.includes("iphone")) return imageMap.iphone;
        if (lowerName.includes("shein")) return imageMap.shein;
        if (lowerName.includes("netflix")) return imageMap.netflix;
        if (lowerName.includes("mcdonald")) return imageMap.mcdonald;
        if (lowerName.includes("food")) return imageMap.food;
        if (lowerName.includes("target")) return imageMap.target;
        if (lowerName.includes("costco")) return imageMap.costco;
        return imageMap.default;
    }

    const container = document.getElementById("offerContainer");
    const search = document.getElementById("searchInput");
    const filter = document.getElementById("filter");

    function render(data) {
        if(data.length === 0) {
            container.innerHTML = `<p class="col-span-full text-center text-slate-400 py-12 font-medium">No rewards matched your search criteria.</p>`;
            return;
        }

        container.innerHTML = data.map(o => {
            const img = getRelevantImage(o.name);
            return `
                <div class="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm hover:shadow-xl transition duration-300 flex flex-col justify-between">
                    <div>
                        <div class="w-full h-36 overflow-hidden rounded-2xl mb-4 bg-slate-50">
                            <img src="${img}" 
                                 class="w-full h-full object-cover transition duration-500 hover:scale-105" 
                                 alt="${o.name}"
                                 onerror="this.onerror=null; this.src='${imageMap.default}';">
                        </div>
                        <span class="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full uppercase tracking-widest">${o.type}</span>
                        <h3 class="font-bold text-base mt-3 mb-1 line-clamp-2 text-slate-800" title="${o.name}">${o.name}</h3>
                        <p class="text-xs text-slate-400 mb-5">ID: ${o.id}</p>
                    </div>
                    <a href="${o.link}" target="_blank" rel="noopener noreferrer" class="block text-center bg-slate-900 text-white py-3 rounded-2xl font-bold hover:bg-indigo-600 transition shadow-sm">Claim Now</a>
                </div>
            `;
        }).join("");
    }

    function update() {
        const val = search.value.toLowerCase();
        const cat = filter.value;
        
        const filtered = offers.filter(o => {
            const matchSearch = o.name.toLowerCase().includes(val) || o.id.toString().includes(val);
            const matchCat = (cat === "all" || o.type === cat);
            return matchSearch && matchCat;
        });
        
        render(filtered);
    }

    search.addEventListener("input", update);
    filter.addEventListener("change", update);
    
    // Initial load execution
    render(offers);
</script>
</body>
</html>
